name: Docker Experiments Smoke Test

on:
  workflow_dispatch:

jobs:
  docker-experiments:
    name: Docker Experiments Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Seed mlir_out_zerobias with microbenchmarks
        run: scripts/generate_microbenchmarks.sh

      - name: Run zero-counts in Docker
        run: make zero-counts LATTICE_FILTER=banded-64

      - name: Run timings in Docker
        run: make timings LATTICE_FILTER=banded-64

      - name: Run oracles in Docker
        run: make oracles LATTICE_FILTER=banded-64
