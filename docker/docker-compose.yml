services:
  convert:
    build:
      context: ..
      dockerfile: docker/Dockerfile.convert
    platform: linux/amd64
    volumes:
      - ../external/bennu/models:/workspace/external/bennu/models:ro
      - ../mlir_out:/workspace/mlir_out
      - ../mlir_out_zerobias:/workspace/mlir_out_zerobias
      - ../scripts:/workspace/scripts:ro
    command: bash /workspace/scripts/convert_models.sh

  run:
    build:
      context: ..
      dockerfile: docker/Dockerfile.run
    volumes:
      - ../mlir_out_zerobias:/workspace/mlir_out_zerobias
      - ../scripts:/workspace/scripts
    command: bash /workspace/scripts/run_zero_counts.sh

  timings:
    build:
      context: ..
      dockerfile: docker/Dockerfile.run
    volumes:
      - ../mlir_out_zerobias:/workspace/mlir_out_zerobias
      - ../scripts:/workspace/scripts
    command: bash /workspace/scripts/run_timings.sh

  oracles:
    build:
      context: ..
      dockerfile: docker/Dockerfile.run
    volumes:
      - ../mlir_out_zerobias:/workspace/mlir_out_zerobias
      - ../scripts:/workspace/scripts
    command: bash /workspace/scripts/run_correctness_oracles.sh
